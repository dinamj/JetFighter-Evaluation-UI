services:
  ui:
    build: .
    image: jetfighter-evaluation
    command: ["ui", "--port", "8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./:/app/evaluation:ro
      - ./results:/app/evaluation/results

  # Labels the Ishihara datase instead of the main dataset
  ui-ishihara:
    build: .
    image: jetfighter-evaluation
    command: ["ui", "--port", "8501", "--dataset", "ishihara_dataset"]
    ports:
      - "8501:8501"
    volumes:
      - ./:/app/evaluation:ro
      - ./results:/app/evaluation/results
